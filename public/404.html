<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TM Digital Marketing</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect to HashRouter for Custom Domain & Subpaths
      (function () {
        var l = window.location;
        var host = l.host.toLowerCase();
        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;

        var isCustomDomain = host.includes('tmdigitalgrow') || !pathname.toLowerCase().includes('tm-digital-marketing');
        var repoPrefix = isCustomDomain ? '' : '/tm-digital-marketing';

        var routePath = pathname;
        if (!isCustomDomain && routePath.toLowerCase().startsWith(repoPrefix)) {
          routePath = routePath.substring(repoPrefix.length);
        }
        if (routePath === '/') routePath = '';

        var targetUrl = l.protocol + '//' + l.host + repoPrefix + '/#' + routePath + search + hash;
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
